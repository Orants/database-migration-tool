buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Add your database extension and driver to the buildscript classpath so the plugin can see it
        classpath('org.flywaydb:flyway-database-postgresql:13.4.0')
        classpath 'org.postgresql:postgresql:42.7.3'
    }
}
plugins {
    id 'java'
    id 'org.flywaydb.flyway' version '13.4.0'
}

group = 'eu.kaitan'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')

    implementation('org.flywaydb:flyway-database-postgresql:13.4.0')
    runtimeOnly('org.postgresql:postgresql:42.7.3')
}

test {
    useJUnitPlatform()
}

def flywayProps = new Properties()
def flywayPropsFile = file('flyway.properties')
if (flywayPropsFile.exists()) {
    flywayPropsFile.withInputStream { flywayProps.load(it) }
}

tasks.matching { it.name.startsWith('flyway') }.configureEach { task ->
    def target = System.getProperty('flyway.url') ?: flywayProps.getProperty('flyway.url') ?: '(not set)'
    task.doFirst { println ">>> ${task.name}  ->  ${target}" }
}